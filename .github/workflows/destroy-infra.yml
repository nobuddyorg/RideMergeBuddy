# One-off: tear down the live GCP infrastructure (VM, static IP, firewall
# rules, DNS record, Maps API key). Project discontinued - Strava now
# requires a paid subscription for API access.
#
# Deliberately does NOT touch the GCS state bucket or the CI service
# account/IAM bindings - that bootstrap is reusable for another project.
# Manual only. Delete this file once the destroy has run.
name: Destroy backend infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: hashicorp/setup-terraform@v3

      - name: Derive an SSH keypair for the VM from the private key secret
        # terraform destroy still needs to compute/refresh the instance
        # resource, which references this metadata value.
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}

      - name: Terraform init
        working-directory: deploy/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=activitymerger"

      - name: Terraform destroy
        working-directory: deploy/terraform
        run: terraform destroy -auto-approve
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_ssh_user: ${{ vars.GCP_SSH_USER }}
          TF_VAR_ssh_public_key_path: /home/runner/.ssh/deploy_key.pub
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
