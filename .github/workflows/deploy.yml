# Builds the app and rolls it out to the already-provisioned GCP VM via
# Ansible. Does NOT run `terraform apply` - infra changes stay a deliberate,
# manual step (see deploy/README.md); this workflow only redeploys the app
# onto whatever host deploy/ansible/inventory.ini points at.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Write .secrets (baked into the jar at build time)
        run: printf '%s' "$APP_SECRETS_JSON" > src/main/resources/.secrets
        env:
          APP_SECRETS_JSON: ${{ secrets.APP_SECRETS_JSON }}

      - name: Build deployable jar
        run: ./deploy/build.sh

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$GCP_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          GCP_HOST: ${{ secrets.GCP_HOST }}

      - name: Run Ansible playbook
        working-directory: deploy/ansible
        run: |
          cat > inventory.ini <<EOF
          [app]
          activitymerger ansible_host=$GCP_HOST ansible_user=$GCP_SSH_USER ansible_ssh_private_key_file=~/.ssh/deploy_key
          EOF
          ansible-playbook -i inventory.ini playbook.yml -e "domain_name=$APP_DOMAIN"
        env:
          GCP_HOST: ${{ secrets.GCP_HOST }}
          GCP_SSH_USER: ${{ secrets.GCP_SSH_USER }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
