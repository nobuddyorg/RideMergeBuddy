# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
      # windows-latest's default JDK has moved past what Gradle 6.8.3 can
      # even parse settings.gradle under ("Unsupported class file major
      # version"), independent of anything this repo's code does - pin it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: create api code
        run: ./gradlew.bat runSwaggerCodeGen

      # Run groovy unit tests and generates code coverage reports
      - name: gradle run unit tests
        run: ./gradlew.bat test

      - name: gradle run code cov enforcement (70%)
        run: ./gradlew.bat coverageLimit

      - name: install dependencies and build and test angular app
        working-directory: ./web-app
        run: |
          npm ci
          npm install @angular/cdk
          npm install -g karma-cli
          npm run build
          npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage

